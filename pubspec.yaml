name: ona_bottom_sheet
description: >-
  Bottom sheets that move like the platform's own: detents, a list and its sheet sharing one drag, spring motion,
  keyboard awareness, modal and always-on sheets, theming and accessibility. Built and maintained by Ona.
version: 0.2.1
homepage: https://github.com/ONA-AI-Labs/ona-bottom-sheet
repository: https://github.com/ONA-AI-Labs/ona-bottom-sheet
issue_tracker: https://github.com/ONA-AI-Labs/ona-bottom-sheet/issues
# Private while it matures inside the Ona app; removed when the package is published.
publish_to: none

topics:
  - bottom-sheet
  - ui
  - widget
  - modal

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router: ">=16.2.1 <19.0.0"
  leak_tracker_flutter_testing: ^3.0.10
  mockito: ^5.4.4
  collection: any
